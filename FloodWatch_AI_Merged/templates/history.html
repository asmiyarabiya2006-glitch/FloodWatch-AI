<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>History</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="container"><nav><a href="/">FloodWatch AI</a><div><a href="/dashboard">Dashboard</a><a href="/prediction">Prediction</a><a href="/alerts">Alerts</a></div></nav><h1>Prediction History</h1><div class="table-wrap"><table><thead><tr><th>ID</th><th>Date</th><th>Location</th><th>Predicted category</th><th>Model target</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ r.id }}</td><td>{{ r.recorded_at }}</td><td>{{ r.location }}</td><td>{{ r.flood_risk }}</td><td>{{ r.model_target }}</td></tr>{% else %}<tr><td colspan="5">No saved predictions.</td></tr>{% endfor %}</tbody></table></div></main></body></html>
